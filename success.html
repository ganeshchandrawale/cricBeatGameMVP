<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — CricBeat</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">

  <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; text-align: center; max-width: 450px;">
    <div style="font-size: 50px; color: #27ae60; margin-bottom: 10px;">✓</div>
    <h2>MATCH ON! ORDER CONFIRMED</h2>
    <p style="color: var(--text-muted); margin-top: 6px;">Thank you for getting the CricBeat Core Pack!</p>

    <div style="margin-top: 15px;">Order Reference:</div>
    <div id="displayOrderId" style="font-family: monospace; font-size: 20px; color: var(--accent-gold); background: rgba(240,165,0,0.1); padding: 8px 16px; border-radius: 6px; display: inline-block; margin: 10px 0; border: 1px dashed var(--accent-gold);">
      CB-IN-000000
    </div>

    <p style="font-size: 13px; color: var(--text-muted);">
      An itemized tax receipt and dispatch notification has been sent to <strong id="displayEmail" style="color: var(--text);">your email</strong>.
    </p>

    <a href="index.html" class="btn-primary" style="margin-top: 20px;">Return to Home</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    document.getElementById('displayOrderId').textContent = urlParams.get('order_id') || 'CB-IN-SUCCESS';
    document.getElementById('displayEmail').textContent = urlParams.get('email') || 'your email';
  </script>
</body>
</html>
