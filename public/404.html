<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CRICBEATGAME</title>
  <script>
    // GitHub Pages SPA redirect — preserve path as a query param,
    // then index.html restores it via history.replaceState.
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1).join('/') +
      '/?p=' + encodeURIComponent(l.pathname + l.search) +
      (l.hash || '')
    );
  </script>
</head>
<body></body>
</html>
