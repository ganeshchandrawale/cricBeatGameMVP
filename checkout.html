<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CricBeat — Order Checkout</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">

  <div style="width: 100%; max-width: 500px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px;">
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="logo">CRICBEAT</div>
      <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Direct-to-Consumer Starter Box</p>
    </div>

    <div style="background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
      <div>
        <div style="font-weight: 700;">Core Board Pack</div>
        <div style="font-size: 12px; color: var(--text-muted);">Starter Set + 78 Player Cards</div>
      </div>
      <div style="font-size: 18px; font-weight: 800; color: var(--accent-gold);">₹1,499</div>
    </div>

    <form id="orderForm" onsubmit="initiateRazorpay(event)">
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px;">FULL NAME</label>
        <input type="text" id="fullName" placeholder="e.g. Rahul Sharma" required style="width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text);">
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px;">EMAIL ADDRESS</label>
        <input type="email" id="email" placeholder="rahul@example.com" required style="width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text);">
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px;">MOBILE NUMBER (FOR UPI & TRACKING)</label>
        <input type="tel" id="mobile" pattern="[0-9]{10}" placeholder="9876543210" required style="width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text);">
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px;">DELIVERY ADDRESS</label>
        <textarea id="address" rows="3" placeholder="House No., Area, City, Pincode" required style="width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text);"></textarea>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; padding: 14px; font-size: 16px;">Pay & Place Order</button>
    </form>
  </div>

  <script src="js/checkout.js"></script>
</body>
</html>
